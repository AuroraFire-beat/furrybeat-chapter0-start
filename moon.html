<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>moon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: #000;
    color: #00ff88;
    font-family: "Courier New", Consolas, "Microsoft YaHei", monospace;
    overflow-x: hidden;
    overflow-y: auto;
  }

  #matrix {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.28;
    pointer-events: none;
  }

  .hidden { display: none !important; }

  .container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1.5rem 4rem;
  }

  .panel {
    max-width: 640px;
    width: 100%;
    padding: 2rem 1.5rem;
    text-align: left;
    background: rgba(0, 0, 0, 0.58);
    border: 1px solid rgba(0, 255, 136, 0.35);
    box-shadow: 0 0 40px rgba(0, 255, 136, 0.08), inset 0 0 40px rgba(0, 255, 136, 0.03);
  }

  .highlight-banner {
    padding: 0.85rem 1rem;
    margin-bottom: 1.6rem;
    border-left: 2px solid #00ff88;
    background: rgba(0, 255, 136, 0.06);
    color: #00ff88;
    font-weight: bold;
    font-size: 0.98rem;
    letter-spacing: 1px;
    line-height: 1.8;
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.55);
    animation: bannerIn 0.8s ease-out;
  }

  .highlight-banner p {
    color: #00ff88;
    margin: 0;
  }

  @keyframes bannerIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .current-line {
    font-size: 0.95rem;
    line-height: 2;
    color: #9fe8c5;
    min-height: 120px;
    display: flex;
    align-items: center;
  }

  .current-line p {
    color: #9fe8c5;
    margin: 0;
    animation: lineFadeIn 0.45s ease-out;
  }

  .current-line p.highlight {
    color: #00ff88;
    font-weight: bold;
    font-size: 1.1rem;
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.7);
  }

  .current-line p.dim {
    color: rgba(0, 255, 136, 0.35);
    font-size: 0.85rem;
  }

  .current-line p.tiny-line {
    color: rgba(0, 255, 136, 0.2);
    font-size: 0.75rem;
    letter-spacing: 2px;
  }

  .current-line p.end {
    color: rgba(0, 255, 136, 0.2);
    font-size: 0.8rem;
    letter-spacing: 4px;
  }

  @keyframes lineFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .wait-hint {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: rgba(0, 255, 136, 0.25);
    letter-spacing: 2px;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 2;
    white-space: nowrap;
  }

  .wait-hint.hidden {
    opacity: 0;
  }

  .offline-hint {
    padding: 2rem;
    color: #00ff88;
    font-family: "Courier New", Consolas, monospace;
    line-height: 2.2;
    font-size: 0.95rem;
  }

  .offline-hint .small {
    color: rgba(0, 255, 136, 0.4);
    font-size: 0.8rem;
    margin-top: 1.5rem;
    display: block;
  }

  @media (max-width: 480px) {
    .current-line { font-size: 0.9rem; min-height: 100px; }
    .highlight-banner { font-size: 0.9rem; }
    .panel { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
  <div class="panel">
    <div id="highlightBanner" class="highlight-banner hidden">
      <p>绒火会记得你。</p>
    </div>
    <div id="currentLine" class="current-line"></div>
  </div>
</div>

<p id="waitHint" class="wait-hint hidden">点击任意位置继续</p>

<script>
/* ------------------------------------------------------------
   本地协议检查：只允许 file:// 打开
   ------------------------------------------------------------ */
if (location.protocol !== 'file:') {
  document.body.innerHTML =
    '<div class="offline-hint">' +
    '这份档案需要从本地打开。<br>' +
    '把它下载到你的设备上，再双击打开。' +
    '<span class="small">——moon</span>' +
    '</div>';
  throw new Error('not local');
}

/* ------------------------------------------------------------
   会话种子
   改动这个值 = 所有玩家进度重置（等于重新下载新版本）
   ------------------------------------------------------------ */
const SESSION_SEED = 'moon-2068-v1';

/* ------------------------------------------------------------
   localStorage 键名
   ------------------------------------------------------------ */
const LS_SEED      = 'furrybeat_wait_seed';
const LS_PROGRESS  = 'furrybeat_wait_progress';
const LS_HIGHLIGHT = 'furrybeat_wait_highlight';

/* ------------------------------------------------------------
   对话内容
   ------------------------------------------------------------ */
const lines = [
  { t: '你走到了这里。' },
  { t: '咱以前觉得，做游戏是为了证明什么。' },
  { t: '证明咱不是他们说的那种人。' },
  { t: '证明咱也能做出点什么。' },
  { t: '但后来咱发现，咱真正想证明的，不是那些。' },
  { t: '咱只是想有一个人，愿意花时间，走进咱的世界。' },
  { t: '你花了那么多时间。' },
  { t: '解了那么多谜。' },
  { t: '等了一个本来不该存在的日期。' },
  { t: '所以咱想跟你说——' },
  { t: ' ', highlight: true },
  { t: '不是因为你解开了谜题。' },
  { t: '是因为你花了这么久，只为了听一只猫狐说一句话。' },
  { t: '这件事本身，就已经是答案了。' },
  { t: '游戏发布后，回来这里。', dim: true },
  { t: '咱还有一句话，没说完。', dim: true },
  { t: '《FurryBeat》第〇章 即将开启...', tiny: true }
];


let progress = 0;
let highlightSeen = false;
let currentIndex = -1;
let currentP = null;
let currentText = '';
let typing = false;
let typeTimer = null;
let finished = false;


function ensureAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) {
    return null;
  }
}

function unlockAudio() {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch (e) {}
}

function playTypeSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(660, now + 0.02);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.025, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.04);
  } catch (e) {}
}

function playLineSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.06, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.42);
  } catch (e) {}
}

function playRevealSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach(function (freq, i) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.08);
      gain.gain.setValueAtTime(0.0001, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.08, now + i * 0.08 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.9);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 1.0);
    });
  } catch (e) {}
}


(function initMatrix() {
  const canvas = document.getElementById('matrix');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, columns, drops;
  const fontSize = 16;
  const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF<>{}[];/\\|+=-_';

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    columns = Math.floor(w / fontSize);
    drops = new Array(columns).fill(0).map(function () {
      return Math.floor(Math.random() * -50);
    });
  }
  window.addEventListener('resize', resize);
  resize();

  function frame() {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, w, h);
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < columns; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = Math.random() > 0.97
        ? 'rgba(190,255,225,0.9)'
        : 'rgba(0,255,136,0.45)';
      ctx.fillText(ch, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(frame);
  }
  frame();
})();


function loadState() {
  let isNewSession = false;

  try {
    const savedSeed = localStorage.getItem(LS_SEED);

    if (savedSeed !== SESSION_SEED) {
      localStorage.setItem(LS_SEED, SESSION_SEED);
      localStorage.setItem(LS_PROGRESS, '0');
      localStorage.setItem(LS_HIGHLIGHT, 'false');
      progress = 0;
      highlightSeen = false;
      isNewSession = true;
    } else {
      progress = parseInt(localStorage.getItem(LS_PROGRESS) || '0', 10);
      highlightSeen = localStorage.getItem(LS_HIGHLIGHT) === 'true';
      if (isNaN(progress) || progress < 0) progress = 0;
      if (progress > lines.length) progress = lines.length;
    }
  } catch (e) {
    progress = 0;
    highlightSeen = false;
    isNewSession = true;
  }

  return isNewSession;
}

function saveState() {
  try {
    localStorage.setItem(LS_PROGRESS, String(progress));
    localStorage.setItem(LS_HIGHLIGHT, highlightSeen ? 'true' : 'false');
  } catch (e) {}
}

/* ------------------------------------------------------------
   渲染
   ------------------------------------------------------------ */
function showHighlightBanner() {
  const banner = document.getElementById('highlightBanner');
  if (!banner) return;
  banner.classList.remove('hidden');
}

function hideHint() {
  const hint = document.getElementById('waitHint');
  if (hint) hint.classList.add('hidden');
}

function showLine(index, animate) {
  clearTimeout(typeTimer);
  typing = false;

  const container = document.getElementById('currentLine');
  container.innerHTML = '';

  currentIndex = index;

  if (index >= lines.length) {
    const p = document.createElement('p');
    p.className = 'end';
    p.textContent = '……';
    container.appendChild(p);
    finished = true;
    hideHint();
    return;
  }

  if (index < 0) return;

  const line = lines[index];
  const p = document.createElement('p');

  if (line.highlight) p.className = 'highlight';
  else if (line.dim) p.className = 'dim';
  else if (line.tiny) p.className = 'tiny-line';

  container.appendChild(p);

  if (animate) {
    p.textContent = '';
    animateLine(p, line.t, index);
  } else {
    p.textContent = line.t;
    onLineComplete(index, false);
  }
}

function animateLine(p, text, index) {
  typing = true;
  currentP = p;
  currentText = text;

  let pos = 0;

  function step() {
    if (!typing) return;

    if (pos >= text.length) {
      typing = false;
      onLineComplete(index, true);
      return;
    }

    const ch = text[pos];
    p.textContent += ch;

    if (pos % 3 === 0) playTypeSound();
    pos++;

    const delay = '，。？！—…、'.indexOf(ch) !== -1 ? 170 : 38;
    typeTimer = setTimeout(step, delay);
  }

  step();
}

function completeAnimation() {
  if (!typing) return;

  clearTimeout(typeTimer);
  typing = false;

  if (currentP) currentP.textContent = currentText;

  onLineComplete(currentIndex, true);
}

function onLineComplete(index, playSound) {
  if (index < 0 || index >= lines.length) return;

  const line = lines[index];

  if (line.highlight) {
    if (!highlightSeen) {
      highlightSeen = true;
      saveState();
    }
    showHighlightBanner();
    if (playSound) playRevealSound();
  } else if (playSound) {
    playLineSound();
  }
}

/* ------------------------------------------------------------
   推进
   ------------------------------------------------------------ */
function advance() {
  if (finished) return;

  if (typing) {
    completeAnimation();
    return;
  }

  const next = currentIndex + 1;

  if (next >= lines.length) {
    progress = lines.length;
    saveState();
    showLine(lines.length, false);
    return;
  }

  progress = next;
  saveState();
  showLine(next, true);
}

/* ------------------------------------------------------------
   初始化
   ------------------------------------------------------------ */
document.addEventListener('DOMContentLoaded', function () {
  const isNewSession = loadState();

  const hint = document.getElementById('waitHint');
  if (hint) hint.classList.remove('hidden');

  if (highlightSeen) showHighlightBanner();

  if (progress >= lines.length) {
    showLine(lines.length, false);
  } else if (isNewSession && progress === 0) {
    showLine(0, true);
  } else {
    showLine(progress, false);
  }

  document.body.addEventListener('touchstart', function onFirstTouch() {
    unlockAudio();
    document.body.removeEventListener('touchstart', onFirstTouch);
  }, { once: true });

  document.body.addEventListener('click', function () {
    unlockAudio();
    advance();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
      e.preventDefault();
      unlockAudio();
      advance();
    }
  });
});
</script>
</body>
</html>
